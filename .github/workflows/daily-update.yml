name: 每日更新日本电力期货数据

# 每天 09:30（Asia/Shanghai = 01:30 UTC）自动运行更新脚本，
# 将新的数据提交回仓库 → Netlify 监听到 push 后自动重新部署。
on:
  schedule:
    - cron: "30 1 * * *"      # UTC 时间；对应北京时间 09:30
  workflow_dispatch:          # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: pip install -r automation/requirements.txt

      - name: 运行每日更新（写入 data/）
        working-directory: automation
        run: python3 japan_power_futures_updater.py --config config.yaml --run-once

      - name: 提交并更新（如有变化则推送，触发 Netlify 部署）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "无数据变化，跳过部署。"
          else
            git commit -m "chore: 每日自动更新日本电力期货数据 $(date +%F)"
            git push
          fi
